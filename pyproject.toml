[project]
name = "mikubot"
version = "0.1.0"
description = "Discord bot that responds with Hatsune Miku voice clips"
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.4.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "fish-audio-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
selfhosted = [
    "fish-speech>=1.5.0",
    "torch>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
